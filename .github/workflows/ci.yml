# Pipeline de l'application monappli-api (GitHub Actions), équivalent du .gitlab-ci.yml
#   pull_request   : build (compilation, tests unitaires, jeux d'essai) — rien n'est publié
#   main/release/* : build -> package (RPM) -> publish-candidate (yum-candidates)
#                    -> propose-integration (PR dans ansible-socle)
#   La release est un workflow à part, déclenché à la main : release.yml
#
# Variables du repo (Settings > Secrets and variables > Actions > Variables) :
#   NEXUS_URL      https://nexus.exemple.local ; vide = Maven Central direct, pas de publication
#   ANSIBLE_REPO   VRoncoroni/ansible-socle
# Secrets : NEXUS_CI_USER, NEXUS_CI_PASSWORD, RPM_SIGNING_KEY, NFPM_RPM_PASSPHRASE, ANSIBLE_REPO_TOKEN
name: ci

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NFPM_VERSION: "2.41.1"
  NFPM_SHA256: "b3cf95aa6dabed836d09ad7f0c190a13c74c5b1304db60846f0f702ee407f430"   # checksums.txt de la release nfpm

jobs:
  # Compile, teste, produit le jar. Le même jar sera emballé : aucun rebuild ensuite.
  build:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      build: ${{ steps.meta.outputs.build }}
      rpm_file: ${{ steps.meta.outputs.rpm_file }}
    env:
      NEXUS_URL: ${{ vars.NEXUS_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Version et numéro de build
        id: meta
        run: |
          MVN="mvn -B ${NEXUS_URL:+-s ci/settings.xml}"
          VERSION=$($MVN help:evaluate -Dexpression=project.version -q -DforceStdout)
          BUILD=${{ github.run_number }}
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "rpm_file=monappli-api-$VERSION-$BUILD.noarch.rpm"
          } >> "$GITHUB_OUTPUT"
          echo "MVN=$MVN" >> "$GITHUB_ENV"
          echo "### Candidat monappli-api $VERSION-$BUILD" >> "$GITHUB_STEP_SUMMARY"

      - name: La version n'est pas déjà publiée
        run: scripts/check-version-free.sh "${{ steps.meta.outputs.version }}"

      - name: Compilation et tests unitaires
        run: $MVN -Dbuild.number=${{ steps.meta.outputs.build }} verify

      - name: Jeux d'essai avec le jar construit
        run: tests/run-cases.sh

      - name: Rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/monappli-api.jar
          retention-days: 7

  package:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-24.04
    env:
      VERSION: ${{ needs.build.outputs.version }}
      BUILD: ${{ needs.build.outputs.build }}
      RPM_FILE: ${{ needs.build.outputs.rpm_file }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with: { name: jar, path: target }

      - name: Installer nfpm (version figée)
        run: |
          curl -fsSL -o nfpm.tar.gz \
            "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_VERSION}/nfpm_${NFPM_VERSION}_Linux_x86_64.tar.gz"
          echo "${NFPM_SHA256}  nfpm.tar.gz" | sha256sum -c
          sudo tar xzf nfpm.tar.gz -C /usr/local/bin nfpm

      - name: Fabriquer le RPM (signé si la clé est fournie)
        env:
          SIGNING_KEY: ${{ secrets.RPM_SIGNING_KEY }}
          NFPM_RPM_PASSPHRASE: ${{ secrets.NFPM_RPM_PASSPHRASE }}
        run: |
          RPM_SIGNING_KEY=""
          if [ -n "$SIGNING_KEY" ]; then
            RPM_SIGNING_KEY="$RUNNER_TEMP/rpm-signing.key"
            install -m 600 /dev/null "$RPM_SIGNING_KEY"
            printf '%s\n' "$SIGNING_KEY" > "$RPM_SIGNING_KEY"
          else
            echo "::warning::RPM_SIGNING_KEY absent : paquet non signé (gpgcheck échouera sur les VM)"
          fi
          export RPM_SIGNING_KEY
          mkdir -p dist
          nfpm package --config packaging/nfpm.yaml --packager rpm --target "dist/$RPM_FILE"
          (cd dist && sha256sum "$RPM_FILE" > "$RPM_FILE.sha256")
          rm -f "$RUNNER_TEMP/rpm-signing.key"
          cat "dist/$RPM_FILE.sha256" >> "$GITHUB_STEP_SUMMARY"

      # L'empreinte sert encore au moment de la release (release.yml la relit)
      - uses: actions/upload-artifact@v4
        with:
          name: rpm-${{ env.VERSION }}-${{ env.BUILD }}
          path: dist/
          retention-days: 90

  publish-candidate:
    if: github.event_name == 'push' && vars.NEXUS_URL != ''
    needs: [build, package]
    runs-on: ubuntu-24.04
    environment: candidates
    env:
      RPM_FILE: ${{ needs.build.outputs.rpm_file }}
    steps:
      - uses: actions/download-artifact@v4
        with: { name: "rpm-${{ needs.build.outputs.version }}-${{ needs.build.outputs.build }}", path: dist }

      - name: Publier dans yum-candidates
        env:
          NEXUS_URL: ${{ vars.NEXUS_URL }}
          NEXUS_CI_USER: ${{ secrets.NEXUS_CI_USER }}
          NEXUS_CI_PASSWORD: ${{ secrets.NEXUS_CI_PASSWORD }}
        run: >-
          curl -fsS -u "$NEXUS_CI_USER:$NEXUS_CI_PASSWORD"
          --upload-file "dist/$RPM_FILE"
          "$NEXUS_URL/repository/yum-candidates/monappli-api/$RPM_FILE"

  propose-integration:
    needs: [build, publish-candidate]
    runs-on: ubuntu-24.04
    environment: candidates
    steps:
      - uses: actions/checkout@v4

      - name: Ouvrir la PR d'intégration dans ansible-socle
        env:
          VERSION: ${{ needs.build.outputs.version }}
          BUILD: ${{ needs.build.outputs.build }}
          ANSIBLE_REPO: ${{ vars.ANSIBLE_REPO || 'VRoncoroni/ansible-socle' }}
          ANSIBLE_REPO_TOKEN: ${{ secrets.ANSIBLE_REPO_TOKEN }}
          AUTO_MERGE: ${{ vars.AUTO_MERGE || 'true' }}
        run: scripts/propose-integration.sh
